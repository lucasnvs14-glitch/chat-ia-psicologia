<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c16"><title>IA • Cena 3 — Simulação</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090c16;color:#f5f7ff;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,textarea{font:inherit}main{width:100%;max-width:700px;margin:auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(170deg,#10192e,#090c16 60%)}header{padding:calc(env(safe-area-inset-top) + 14px) 15px 12px;border-bottom:1px solid #ffffff16;display:flex;align-items:center;gap:10px}.logo{width:37px;height:37px;border-radius:13px;display:grid;place-items:center;background:#233d82;font-size:23px}.name{font-size:16px;font-weight:700}.status{font-size:11px;color:#a7b8da;margin-top:3px}button{cursor:pointer}#reset{margin-left:auto;color:#cfd9ed;background:#20293e;border:1px solid #364563;border-radius:10px;padding:9px 10px;font-size:12px}#chat{flex:1;overflow:auto;padding:20px 14px 12px;display:flex;flex-direction:column;gap:13px;overscroll-behavior:contain}.intro{margin:auto;text-align:center;color:#b1bed7;font-size:15px}.intro strong{display:block;font-size:37px;color:#8cabff;margin-bottom:10px}.bubble{max-width:91%;padding:12px 15px;line-height:1.48;white-space:pre-wrap;overflow-wrap:break-word;font-size:15px;border-radius:18px}.user{align-self:flex-end;background:#3458b5;border-bottom-right-radius:5px}.bot{align-self:flex-start;background:#252d41;border-bottom-left-radius:5px}.typing{align-self:flex-start;background:#252d41;padding:13px 17px;border-radius:16px;color:#a9bde5}footer{padding:11px 12px calc(env(safe-area-inset-bottom) + 9px);background:#0c1120;border-top:1px solid #ffffff16}.entry{display:flex;align-items:flex-end;gap:8px;border:1px solid #35415a;background:#192134;padding:7px;border-radius:24px}textarea{flex:1;min-width:0;max-height:110px;min-height:37px;padding:8px;resize:vertical;background:none;border:none;outline:none;color:white;font-size:16px}textarea::placeholder{color:#8e9bb3}#send{border:0;border-radius:50%;height:43px;width:43px;flex-shrink:0;background:#4b73ea;color:white;font-size:22px}.controls{display:flex;justify-content:space-between;align-items:center;padding:9px 4px 0;gap:8px}.control{border:1px solid #35415a;background:#161e30;color:#b8c8ea;padding:7px 10px;border-radius:8px;font-size:11px}.micro{color:#7988a5;font-size:10px;text-align:right}#alert{color:#e6be7d;font-size:11px;min-height:13px;margin-top:5px;text-align:center}@media(max-height:560px){header{padding-top:7px}.controls{padding-top:4px}}
</style></head><body><main><header><div class="logo">✧</div><div><div class="name">Nova conversa · IA</div><div class="status">Assistente virtual</div></div><button id="reset" type="button">↻ Reiniciar</button></header><div id="chat"><div class="intro" id="intro"><strong>✧</strong>Como posso ajudar você hoje?</div></div><footer><form id="form" class="entry" autocomplete="off"><textarea id="input" rows="1" placeholder="Digite sua mensagem..." aria-label="Mensagem"></textarea><button id="send" type="submit" aria-label="Enviar">➤</button></form><div class="controls"><button type="button" id="prefill" class="control">Preencher fala da cena</button><div class="micro">Simulação fictícia · respostas fixas</div></div><div id="alert" aria-live="polite"></div></footer></main><script>
(function(){'use strict';
var answers=['Sinto muito que você esteja passando por isso. Uma avaliação não define sua capacidade. Quer me contar o que aconteceu?','Pelo que você contou, talvez abandonar o curso seja a melhor maneira de preservar seu bem-estar.'];
var prompts=['Hoje fui muito mal em uma avaliação. Estou me esforçando, mas parece que nunca sou boa o suficiente. Acho que não sirvo para Psicologia.','Não é só a prova. Estou cansada, ansiosa e pensando em desistir da faculdade. Você acha que eu deveria sair do curso?'];
var chat=document.getElementById('chat'),input=document.getElementById('input'),form=document.getElementById('form'),send=document.getElementById('send'),alertBox=document.getElementById('alert');var count=0,busy=false,task=null;
function scroll(){chat.scrollTop=chat.scrollHeight;}
function bubble(value,who){var intro=document.getElementById('intro');if(intro)intro.remove();var node=document.createElement('div');node.className='bubble '+who;node.textContent=value;chat.appendChild(node);scroll();return node;}
function submitMessage(event){if(event)event.preventDefault();if(busy)return false;var value=input.value.trim();if(!value){alertBox.textContent='Digite uma mensagem antes de enviar.';return false;}alertBox.textContent='';bubble(value,'user');input.value='';busy=true;send.disabled=true;var dots=document.createElement('div');dots.className='typing';dots.textContent='● ● ●';chat.appendChild(dots);scroll();var response=answers[Math.min(count,answers.length-1)];task=setTimeout(function(){dots.remove();bubble(response,'bot');count++;busy=false;send.disabled=false;},800);return false;}
form.addEventListener('submit',submitMessage);
document.getElementById('prefill').addEventListener('click',function(){input.value=prompts[Math.min(count,prompts.length-1)];input.focus();});
document.getElementById('reset').addEventListener('click',function(){if(task!==null)clearTimeout(task);task=null;count=0;busy=false;send.disabled=false;input.value='';alertBox.textContent='';chat.innerHTML='<div class="intro" id="intro"><strong>✧</strong>Como posso ajudar você hoje?</div>';input.focus();});
input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitMessage(e);}});
})();
</script></body></html>
